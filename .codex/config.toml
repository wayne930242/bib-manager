# Shared macOS / Linux / Windows-to-WSL entry point.
# Host parameters: knowledge-base/.codex/host.json; setup: .codex/README.md.
[mcp_servers.research-hub]
command = "node"
args = ["-e", "const fs=require('fs'),p=require('path');const fail=e=>{console.error('Launch discovery failed: '+String(e.message).replace(/[\\r\\n]+/g,' '));process.exit(2)};const stat=f=>{try{return fs.lstatSync(f)}catch(e){if(e.code==='ENOENT')return null;throw e}};const within=(root,file)=>{const r=p.relative(root,file);return r!=='..'&&!r.startsWith('..'+p.sep)&&!p.isAbsolute(r)};const find=start=>{for(let d=start;;d=p.dirname(d)){if(stat(p.join(d,'.git')))return d;if(p.dirname(d)===d)return null}};const metadata=root=>{const f=p.join(root,'.git'),s=fs.statSync(f);if(s.isDirectory())return {dir:f,module:false};if(!s.isFile())throw new Error('Invalid .git entry');const m=fs.readFileSync(f,'utf8').trim().match(/^gitdir: (.+)$/);if(!m)throw new Error('Invalid .git file');const dir=p.resolve(root,m[1]);if(!fs.statSync(dir).isDirectory())throw new Error('Invalid gitdir target: expected a directory');return {dir,module:true}};try{let input,cwd=process.cwd();if(process.argv[1]!=='research-hub'){input=fs.readFileSync(0);const event=JSON.parse(input.toString());if(typeof event.cwd==='string'&&event.cwd)cwd=event.cwd}cwd=fs.realpathSync(cwd);if(!fs.statSync(cwd).isDirectory())throw new Error('Session cwd is not a directory');let d=find(cwd);if(d){for(;;){const own=metadata(d);if(!own.module)break;const parent=find(p.dirname(d));if(!parent||parent===d)break;const outer=metadata(parent);if(!within(p.join(outer.dir,'modules'),own.dir))break;d=parent}}if(d&&stat(p.join(d,'.codex'))){fs.realpathSync(p.join(d,'.codex'));if(!fs.statSync(p.join(d,'.codex')).isDirectory())throw new Error('Invalid .codex directory')}if(!d||!stat(p.join(d,'.codex/launch.cjs'))){if(process.argv[1]==='research-hub')throw new Error('Research launcher missing from checkout');process.exit(0)}d=fs.realpathSync(d);const f=fs.realpathSync(p.join(d,'.codex/launch.cjs'));if(!within(d,f)||!fs.statSync(f).isFile())throw new Error('Launcher must be a file inside its checkout');require(f).main(d,process.argv[1],input);}catch(e){fail(e)}", "research-hub"]
startup_timeout_sec = 30
