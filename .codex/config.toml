# Shared macOS / Linux / Windows-to-WSL entry point.
# Host parameters: knowledge-base/.codex/host.json; setup: .codex/README.md.
[mcp_servers.research-hub]
command = "node"
args = ["-e", "const fs=require('fs'),p=require('path'),cp=require('child_process'),env={...process.env};for(const k of Object.keys(env))if(/^GIT_/i.test(k))delete env[k];let d,f;try{const git=(cwd,arg)=>cp.execFileSync('git',['rev-parse',arg],{cwd,env,encoding:'utf8',stdio:['ignore','pipe','ignore']}).trim();d=git(process.cwd(),'--show-toplevel');for(;;){let s=git(d,'--show-superproject-working-tree');if(!s)break;d=s}d=fs.realpathSync(d);f=fs.realpathSync(p.join(d,'.codex/launch.cjs'));const r=p.relative(d,f);if(r==='..'||r.startsWith('..'+p.sep)||p.isAbsolute(r)||!fs.statSync(f).isFile())f=undefined}catch{f=undefined}if(!f){if(process.argv[1]==='research-hub'){console.error('Research launcher missing from checkout');process.exit(2)}process.exit(0)}require(f).main(d,process.argv[1])", "research-hub"]
startup_timeout_sec = 30
