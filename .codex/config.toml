# Shared macOS / Linux / Windows-to-WSL entry point.
# Host parameters: knowledge-base/.codex/host.json; setup: .codex/README.md.
[mcp_servers.research-hub]
command = "node"
args = ["-e", "const fs=require('fs'),p=require('path');let d=process.cwd();while(!fs.existsSync(p.join(d,'.codex/launch.cjs'))){let n=p.dirname(d);if(n===d){if(process.argv[1]==='research-hub'){console.error('Research launcher missing from checkout');process.exit(2)}process.exit(0)}d=n}require(p.join(d,'.codex/launch.cjs')).main(d,process.argv[1])", "research-hub"]
startup_timeout_sec = 30
